name: Fetch All Years Papers

on:
  workflow_dispatch:
    inputs:
      create_issue:
        description: 'Create GitHub issue for new papers'
        required: false
        default: false
        type: boolean

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
      RUN_ENV: "prod"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Discover official DBLP snapshot
        id: snapshot
        run: python scripts/sync_dblp_snapshot.py --metadata-only --github-output "$GITHUB_OUTPUT"

      - name: Restore DBLP snapshot cache
        uses: actions/cache@v4
        with:
          path: .cache/dblp
          key: ${{ runner.os }}-dblp-${{ steps.snapshot.outputs.release }}

      - name: Download official DBLP snapshot
        run: python scripts/sync_dblp_snapshot.py

      - name: Run dblp watcher (all years)
        run: |
          cd src && python main.py run --env=${{ env.RUN_ENV }} --all_years

      - name: Update AI Infra paper list
        run: |
          python scripts/convert_cache_to_md.py

      - name: Setup var
        id: vars
        run: |
          {
            echo "content<<EOF"
            echo "$MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup GIT user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push done work
        run: |
          git diff --exit-code || git commit -am "Fetch all-years papers @ $(date '+%Y-%m-%d %H:%M')"
          git push origin main

      - name: Create an issue for new papers
        if: ${{ inputs.create_issue && env.MSG != '' }}
        continue-on-error: true
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ steps.vars.outputs.content }}
          ISSUE_TITLE_TOPICS: ${{ env.ISSUE_TITLE_TOPICS }}
        with:
          filename: .github/issue-template.md
