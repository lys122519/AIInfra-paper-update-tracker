name: Run DBLP Watch

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Run one read-only DBLP query instead of the full tracker"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Shanghai"
      RUN_ENV: "prod" # within ['prod', 'dev']
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      # ============================================
      # TODO [√] 检查工作分支及 Workflows 运行环境
      # ============================================
      - name: Checkout
        uses: actions/checkout@v4
      # ============================================
      # TODO [√] 创建 Python3.6+ 编译环境
      # ============================================
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # ============================================
      # TODO [√] 安装 Project 第三方依赖
      # ============================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # ============================================
      # TODO [√] 测试 Scaffold 脚手架指令
      # ============================================
      - name: Run DBLP smoke test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_test }}
        run: |
          cd src && python main.py run --env=dev --all_years --keyword_limit=1 --query_limit=1 --max_results=10 --dry_run --skip_enrichment

      - name: Run full DBLP watcher
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_test }}
        run: |
          cd src && python main.py run --env=${{ env.RUN_ENV }}

      - name: Extract related code links
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_test }}
        run: |
          python scripts/fetch_related_code.py
        continue-on-error: true

      - name: Fetch missing abstracts
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_test }}
        run: |
          python scripts/fetch_abstracts.py
        continue-on-error: true

      - name: Update AI Infra paper list
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_test }}
        run: |
          python scripts/convert_cache_to_md.py

      - name: Setup var
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_test }}
        id: vars
        run: |
          content=${{ env.MSG }}
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'%0A'}"
          content="${content//$'\r'/'%0D'}"
          echo "::set-output name=content::$content"
      # ============================================
      # TODO [√] 更新仓库数据
      # ============================================
      - name: Setup GIT user
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Push done work
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smoke_test }}
        run: |
          git diff --exit-code || git commit -am "Fetch new papers @ $(date '+%Y-%m-%d %H:%M') [skip ci]"
          git push origin main

      - name: Create an issue for new papers
        if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.smoke_test) && env.MSG != '' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSG: ${{ steps.vars.outputs.content }}
          ISSUE_TITLE_TOPICS: ${{ env.ISSUE_TITLE_TOPICS }}
        with:
          filename: .github/issue-template.md
