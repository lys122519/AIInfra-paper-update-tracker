dblp:
  # Use DBLP's official monthly XML release instead of the interactive search API.
  source: snapshot
  url: https://dblp.org/search/publ/api?q={}&format=json&h=1000
  snapshot:
    path: .cache/dblp/dblp.xml.gz
    dtd_path: .cache/dblp/dblp.dtd
    # Local XML records are assigned to venues by their stable DBLP key prefix.
    query_key_prefixes:
      "venue:MLSys:": conf/mlsys
      "venue:NeurIPS:": conf/nips
      "venue:ICML:": conf/icml
      "venue:ICLR:": conf/iclr
      "venue:OSDI:": conf/osdi
      "venue:SOSP:": conf/sosp
      "streamid:conf/eurosys:": conf/eurosys
      "streamid:conf/usenix:": conf/usenix
      "streamid:conf/cloud:": conf/cloud
      "venue:Middleware:": conf/middleware
      "venue:NSDI:": conf/nsdi
      "venue:SIGCOMM:": conf/sigcomm
      "streamid:conf/sc:": conf/sc
      "venue:HPDC:": conf/hpdc
      "venue:ASPLOS:": conf/asplos
      "venue:ISCA:": conf/isca
      "venue:MICRO:": conf/micro
      "venue:HPCA:": conf/hpca
      "streamid:journals/tocs:": journals/tocs
      "streamid:journals/tpds:": journals/tpds
  keywords:
    # AI infrastructure and resource management
    - AI infrastructure
    - AI schedul
    - GPU schedul
    - GPU resource
    - accelerator cluster
    # AI training and inference infrastructure
    - ML system
    - distributed training
    - parallel training
    - LLM inference
    - model serving
    - inference serving
    # Communication and orchestration
    - collective communication
    - RDMA
    - Kubernetes
    - tensor parallel
    - pipeline parallel
  queries:
    # AI / ML systems
    - "venue:MLSys:"
    - "venue:NeurIPS:"
    - "venue:ICML:"
    - "venue:ICLR:"
    # Operating systems, cloud, and distributed systems
    - "venue:OSDI:"
    - "venue:SOSP:"
    - "streamid:conf/eurosys:"
    - "streamid:conf/usenix:"
    - "streamid:conf/cloud:"
    - "venue:Middleware:"
    # Networking and communication
    - "venue:NSDI:"
    - "venue:SIGCOMM:"
    # High-performance computing
    - "streamid:conf/sc:"
    - "venue:HPDC:"
    # Computer architecture and accelerators
    - "venue:ASPLOS:"
    - "venue:ISCA:"
    - "venue:MICRO:"
    - "venue:HPCA:"
    # Systems journals
    - "streamid:journals/tocs:"
    - "streamid:journals/tpds:"
  mails:
    - "im.young@foxmail.com"
